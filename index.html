<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Juliana FNAILS — Agenda Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
:root{
  --pink:#d63384;--pink-light:#ffe6f0;--pink-mid:#f8b4d4;
  --pink-dark:#b5206a;--pink-glow:rgba(214,51,132,.12);
  --white:#fff;--gray:#6c757d;--gray-light:#f8f9fa;
  --text:#3d2030;--border:#f0d0e0;
  --radius:16px;--radius-sm:10px;
  --shadow:0 4px 20px rgba(214,51,132,.12);
  --shadow-sm:0 2px 10px rgba(214,51,132,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:#fff9fc;color:var(--text);min-height:100vh}
.screen{display:none;min-height:100vh}.screen.active{display:block}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loading-overlay.active{display:flex}
.spin{width:44px;height:44px;border:4px solid var(--pink-light);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite}
.spin-sm{display:inline-block;width:15px;height:15px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:var(--pink);font-weight:600;font-size:14px}

/* HERO */
.hero{background:linear-gradient(160deg,#fff0f7 0%,#fff 50%,#ffe6f0 100%);padding:24px 16px 16px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hero-logo{font-size:34px;display:block;margin-bottom:5px;cursor:pointer}
.hero-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--pink);font-weight:700;line-height:1.2}
.hero-sub{font-size:11px;color:var(--gray);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.hero-actions{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-hero-login{padding:8px 18px;background:var(--pink);color:#fff;border:none;border-radius:30px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-hero-login:hover{background:var(--pink-dark)}
.btn-hero-meus{padding:8px 16px;background:var(--pink-light);color:var(--pink);border:1.5px solid var(--pink-mid);border-radius:30px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.btn-hero-logout{padding:7px 14px;background:transparent;color:var(--gray);border:1.5px solid var(--border);border-radius:30px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.user-chip{display:inline-flex;align-items:center;gap:5px;background:var(--pink-light);border:1.5px solid var(--pink-mid);border-radius:30px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--pink-dark)}

/* SECTION TABS (MÃOS/PÉS) */
.section-tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:110px;z-index:90}
.section-tab{flex:1;padding:13px 10px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;border:none;background:transparent;font-family:'Nunito',sans-serif;color:var(--gray);transition:all .2s;border-bottom:3px solid transparent;margin-bottom:-2px}
.section-tab.active{color:var(--pink);border-bottom-color:var(--pink)}

/* SERVICES PAGE */
.services-page{max-width:720px;margin:0 auto;padding:0 0 220px}
.section-panel{display:none}.section-panel.active{display:block}

/* ACCORDION */
.accordion-item{border-bottom:1px solid var(--border)}
.accordion-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;background:#fff;border:none;cursor:pointer;font-family:'Nunito',sans-serif;text-align:left;transition:background .15s;gap:10px}
.accordion-header:active{background:var(--pink-light)}
.accordion-header.open{background:#fff8fb}
.acc-icon{font-size:24px;flex-shrink:0}
.acc-info{flex:1}
.acc-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--text);line-height:1.2}
.acc-meta{font-size:11px;color:var(--gray);margin-top:2px}
.acc-right{display:flex;align-items:center;gap:8px}
.acc-arrow{font-size:16px;color:var(--pink-mid);transition:transform .25s}
.accordion-header.open .acc-arrow{transform:rotate(180deg)}
.sel-badge{background:var(--pink);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.accordion-body{display:none;background:#fdf5f9;border-top:1px solid var(--pink-light)}
.accordion-body.open{display:block}

/* SUBSECTION LABEL */
.sub-label{padding:10px 16px 4px;font-size:10px;font-weight:700;color:var(--pink-dark);text-transform:uppercase;letter-spacing:.8px}

/* VARIANT ITEM */
.variant-item{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--pink-light);cursor:pointer;transition:background .15s;gap:12px;user-select:none;-webkit-user-select:none}
.variant-item:last-child{border-bottom:none}
.variant-item:active,.variant-item.selected{background:rgba(214,51,132,.06)}
.v-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--pink-mid);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:transparent;transition:all .2s}
.variant-item.selected .v-check{background:var(--pink);border-color:var(--pink);color:#fff}
.v-info{flex:1}
.v-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.v-sub{font-size:11px;color:var(--gray);margin-top:1px}
.v-manu{font-size:11px;color:var(--pink);margin-top:2px;font-weight:600}
.v-price{font-size:15px;font-weight:700;color:var(--pink);white-space:nowrap;flex-shrink:0}

/* ADICIONAL ITEM */
.adicional-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--pink-light);cursor:pointer;transition:background .15s;gap:12px;user-select:none;-webkit-user-select:none}
.adicional-item:last-child{border-bottom:none}
.adicional-item:active,.adicional-item.selected{background:rgba(214,51,132,.06)}
.add-plus{font-size:22px;color:var(--pink-mid);flex-shrink:0;transition:transform .25s;line-height:1}
.adicional-item.selected .add-plus{color:var(--pink);transform:rotate(45deg)}
.add-name-wrap{flex:1}
.add-name{font-size:14px;font-weight:600;color:var(--text)}
.add-desc{font-size:11px;color:var(--gray);margin-top:1px}
.add-price{font-size:14px;font-weight:700;color:var(--pink);flex-shrink:0}

/* BOOKING CARD */
.booking-card{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:2px solid var(--pink-light);box-shadow:0 -4px 24px rgba(214,51,132,.15);padding:12px 16px}
.booking-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.booking-total{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--pink)}
.booking-meta{font-size:11px;color:var(--gray)}
.booking-inputs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.b-input{flex:1;min-width:130px;padding:10px 12px;border:2px solid var(--pink-light);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:13px;color:var(--text);outline:none;background:#fff;cursor:pointer;min-height:42px}
.b-input:focus{border-color:var(--pink)}
.time-slots-wrap{flex-basis:100%;width:100%}
.time-slots{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.time-slot{padding:7px 14px;border:2px solid var(--pink-mid);border-radius:30px;font-size:13px;font-weight:600;color:var(--pink);cursor:pointer;transition:all .2s;background:#fff}
.time-slot:active,.time-slot.sel{background:var(--pink);color:#fff;border-color:var(--pink)}
.time-slot.dis{opacity:.4;cursor:not-allowed;background:var(--gray-light);border-color:#ddd;color:var(--gray)}
.btn-confirm{width:100%;padding:14px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(214,51,132,.35);transition:transform .2s}
.btn-confirm:active{transform:scale(.98)}

/* AUTH MODAL (bottom sheet) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(50,10,30,.55);z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:24px 20px 36px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:38px;height:4px;background:var(--pink-light);border-radius:4px;margin:0 auto 18px}
.modal-title{font-family:'Playfair Display',serif;font-size:19px;color:var(--pink);margin-bottom:4px;font-weight:700}
.modal-sub{font-size:13px;color:var(--gray);margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--pink-dark);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.form-group input{width:100%;padding:12px 42px 12px 13px;border:2px solid var(--pink-light);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:15px;color:var(--text);background:#fff;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-glow)}
.eye-btn{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--gray);z-index:2}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(214,51,132,.35);transition:transform .15s}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-secondary{width:100%;padding:12px;background:var(--pink-light);color:var(--pink);border:2px solid var(--pink-mid);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-link{width:100%;padding:10px;background:transparent;color:var(--gray);border:none;font-family:'Nunito',sans-serif;font-size:13px;cursor:pointer;margin-top:5px}
.auth-error{color:#c0392b;font-size:13px;margin-top:6px;display:none;text-align:center;padding:8px;background:#fdf0f0;border-radius:8px}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--gray);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--pink-light)}

/* POLICY SHEET */
.policy-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:24px 20px 36px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
.policy-item{display:flex;gap:11px;margin-bottom:13px}
.policy-icon{font-size:20px;flex-shrink:0}
.policy-text{font-size:13px;color:var(--text);line-height:1.6}
.policy-text strong{color:var(--pink-dark)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1}

/* TOAST */
.toast{position:fixed;bottom:210px;right:14px;background:#3d2030;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:700;transform:translateY(20px);opacity:0;transition:all .3s;max-width:260px;border-left:3px solid var(--pink)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#1a4731;border-left-color:#28a745}
.toast.error{background:#4a1010;border-left-color:#dc3545}

/* APP HEADER */
.app-header{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:600}
.app-header-sub{font-size:10px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
.btn-back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-exit{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif}

/* APPOINTMENTS */
.appt-wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
.booking-row{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px;margin-bottom:12px;border-left:4px solid var(--pink-mid)}
.br-services{font-size:14px;font-weight:600;color:var(--text);margin-bottom:7px;line-height:1.4}
.br-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700}
.pill-pink{background:var(--pink-light);color:var(--pink)}
.pill-gray{background:var(--gray-light);color:var(--gray)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-orange{background:#fff3cd;color:#b8620c}
.badge-green{background:#d4edda;color:#155724}
.badge-red{background:#f8d7da;color:#721c24}
.badge-purple{background:#e9d8fd;color:#553c9a}

/* ADMIN */
.admin-wrap{max-width:960px;margin:0 auto;padding:18px 14px 80px}
.admin-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.admin-tab{padding:8px 16px;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--pink-mid);background:#fff;color:var(--pink);transition:all .2s;font-family:'Nunito',sans-serif}
.admin-tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.admin-panel{display:none}.admin-panel.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);text-align:center;border-top:3px solid var(--pink)}
.stat-value{font-size:20px;font-weight:700;color:var(--pink);font-family:'Playfair Display',serif}
.stat-label{font-size:10px;color:var(--gray);margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:8px 11px;border:2px solid var(--pink-light);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:13px;color:var(--text);outline:none;background:#fff}
.filter-bar input{flex:1;min-width:120px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
thead tr{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff}
thead th{padding:11px 12px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--pink-light);transition:background .1s}
tbody tr:hover{background:var(--pink-light)}
tbody td{padding:11px 12px;vertical-align:middle}
.action-btn{padding:4px 8px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap}
.act-green{background:#d4edda;color:#155724}
.act-red{background:#f8d7da;color:#721c24}
.act-purple{background:#e9d8fd;color:#553c9a}
.blocked-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.blocked-tag{background:#ffe0e0;border:1px solid #ffb3b3;border-radius:20px;padding:4px 11px;font-size:12px;color:#c0392b;display:flex;align-items:center;gap:5px}
.blocked-tag button{background:none;border:none;cursor:pointer;color:#c0392b;font-size:14px;line-height:1}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--gray)}
.empty-state .icon{font-size:44px;margin-bottom:10px}

/* FLATPICKR */
.flatpickr-calendar{border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--pink-light)}
.flatpickr-day.selected,.flatpickr-day.selected:hover{background:var(--pink);border-color:var(--pink)}
.flatpickr-months .flatpickr-month{background:var(--pink);color:#fff}
span.flatpickr-weekday{background:var(--pink-light);color:var(--pink-dark);font-weight:700}

@media(max-width:600px){
  .hero{padding:18px 14px 12px}
  .hero-title{font-size:19px}
  .section-tabs{top:102px}
  .booking-card{padding:10px 12px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .admin-tab{padding:7px 11px;font-size:12px}
}
</style>
</head>
